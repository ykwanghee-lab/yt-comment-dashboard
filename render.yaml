# Render Blueprint: 수능시험장 찾기 (정적 사이트)
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
services:
  - type: web
    name: suneung-map
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: suneung-map/web
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /.well-known/*
        name: Content-Type
        value: application/json
    routes:
      - type: rewrite
        source: /
        destination: /index.html
