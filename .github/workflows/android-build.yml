name: Android AAB 빌드

on:
  push:
    paths:
      - "suneung-map/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suneung-map/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 서명 키 준비 (비밀값 없으면 임시 키로 빌드만 검증)
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$B64" ] && [ -n "$PW" ]; then
            echo "$B64" | base64 -d > upload.jks
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNED=signed" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp1234 -keypass temp1234 -dname "CN=temp, O=temp, C=KR"
            echo "KEYSTORE_PASSWORD=temp1234" >> "$GITHUB_ENV"
            echo "SIGNED=TEMPKEY-do-not-upload" >> "$GITHUB_ENV"
          fi

      - name: AAB / APK 빌드
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: suneung-map-${{ env.SIGNED }}-build${{ github.run_number }}
          path: |
            suneung-map/android/app/build/outputs/bundle/release/*.aab
            suneung-map/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
